<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Submit a work proposal to Ma’isah Bateman, independent consultant in urban planning, economic development and GIS.">
  <title>Submit a work proposal | Ma’isah Bateman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">
  <header class="topbar">
    <a class="wordmark" href="index.html">M.B.</a>
    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">MENU <span>＋</span></button>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html#about">About</a>
      <a href="index.html#services">Services</a>
      <a href="projects.html">Previous projects</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="contact section proposal-page">
      <p class="section-kicker">WORK PROPOSAL</p>
      <div class="contact-grid">
        <div>
          <h2>Tell me about<br><em>your project.</em></h2>
          <p class="proposal-intro">Share a few details about the opportunity and what you hope to achieve. I read every proposal and will reply by email.</p>
        </div>
        <form id="proposal-form">
          <label for="name">Your name</label><input id="name" name="name" required placeholder="Name" autocomplete="name">
          <label for="email">Your email</label><input id="email" name="email" type="email" required placeholder="Email address" autocomplete="email">
          <label for="organization">Organization</label><input id="organization" name="organization" placeholder="Organization (optional)" autocomplete="organization">
          <label for="project_type">Type of work</label>
          <select id="project_type" name="project_type" required>
            <option value="" disabled selected>Select one</option>
            <option>Urban and regional planning</option>
            <option>Economic development</option>
            <option>Business development and strategy</option>
            <option>International research and market entry</option>
            <option>GIS and spatial analysis</option>
            <option>Something else</option>
          </select>
          <label for="timeline">Timeline</label>
          <select id="timeline" name="timeline">
            <option value="" disabled selected>When do you need this? (optional)</option>
            <option>Within a month</option>
            <option>One to three months</option>
            <option>Three to six months</option>
            <option>Flexible</option>
          </select>
          <label for="budget">Budget range</label><input id="budget" name="budget" placeholder="Budget range (optional)">
          <label for="description">About the project</label><textarea id="description" name="description" rows="6" required placeholder="What is the project, who is it for, and what outcome are you looking for?"></textarea>
          <input class="hp-field" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button type="submit">Send proposal <span>↗</span></button>
          <p class="form-status" id="proposal-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer><a href="index.html">MA’ISAH BATEMAN</a><span>INDEPENDENT CONSULTING</span><a href="https://www.linkedin.com/in/maisahbateman" target="_blank" rel="noopener">LINKEDIN ↗</a><a href="mailto:projects@maisahbateman.com">EMAIL ↗</a><a href="#top">BACK TO TOP ↑</a></footer>
  <script src="script.js"></script>
</body>
</html>
